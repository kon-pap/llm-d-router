apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${INF_DEPLOYMENT_NAME}
  labels:
    app: ${INF_APP_NAME}
spec:
  replicas: ${INF_REPLICA_COUNT}
  selector:
    matchLabels:
      app: ${INF_APP_NAME}
      llm-d.ai/component: ${INF_ROLE}
  template:
    metadata:
      labels:
        app: ${INF_APP_NAME}
        llm-d.ai/component: ${INF_ROLE}
        llm-d.ai/role: ${INF_ROLE}
    spec:
      containers:
        - name: vllm-${INF_ROLE}
          image: ${VLLM_IMAGE}
          imagePullPolicy: IfNotPresent
          command:
            - "vllm"
          args:
            - "serve"
            - ${MODEL_NAME}
            - "--served-model-name"
${INF_SERVED_MODEL_NAME}
            - "--skip-tokenizer-init"
            - "-cc.mode=none"
            - "-cc.cudagraph_mode=none"
            - "--enable-mm-embeds"
            - "--renderer-num-workers"
            - ${INF_RENDERER_NUM_WORKERS_STR}
            - --mm-processor-cache-gb
            - "0"
            - "--runner"
            - "pooling"
            - "--max-model-len"
            - "1"
            - "--max-num-seqs"
            - ${INF_MAX_NUM_SEQS_STR}
            - "--hf-overrides"
            - '{"dtype": "torch.float16"}'
            - "--dtype"
            - "float16"
            - "-cc.pass_config.fuse_norm_quant=false"
            - "-cc.pass_config.fuse_act_quant=false"
            - "--model-impl"
            - "terratorch"
            - "--port"
            - ${TARGET_PORT_STR}
            - "--otlp-traces-endpoint"
            - ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT}
            - "--io-processor-plugin"
            - ${IO_PROCESSOR_PLUGIN}
            - "--pooling_cache_config"
            - ${POOLING_CACHE_CONFIG}
          ports:
            - name: http
              containerPort: ${TARGET_PORT}
              protocol: TCP
            - name: tcp-io
              containerPort: ${IO_PORT}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: ${TARGET_PORT}
            failureThreshold: 60  # Allow up to 10 minutes (60 * 10s)
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: ${TARGET_PORT}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: ${TARGET_PORT}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: OMP_NUM_THREADS
              value: ${OMP_NUM_THREADS_STR}
            - name: USER
              value: "vllm"
            - name: VLLM_USE_DEEP_GEMM
              value: "0"
            - name: HF_TOKEN
              value: ${HF_TOKEN}
            - name: HOME
              value: /tmp/cache
            - name: OTEL_EXPORTER_OTLP_TRACES_PROTOCOL
              value: ${OTEL_EXPORTER_OTLP_TRACES_PROTOCOL}
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
            - name: PORT
              value: ${TARGET_PORT_STR}
            - name: PYTHONHASHSEED
              value: "42"
            - name: PYTHONPATH
              value: "/opt/venv/lib/python3.12/site-packages"
            - name: VLLM_LOGGING_LEVEL
              value: ${VLLM_LOGGING_LEVEL}
          volumeMounts:
            - name: cache
              mountPath: /tmp/cache
            - name: io-transfer-volume
              mountPath: /tmp/io_transfer
              readOnly: false
            - name: datasets
              mountPath: /tmp/datasets
          resources:
            requests:
              cpu: ${INF_CPU_RESOURCES}
              memory: ${INF_MEMORY_RESOURCES}
              nvidia.com/gpu: ${INF_GPU_RESOURCES}
            limits:
              cpu: ${INF_CPU_RESOURCES_LIM}
              memory: ${INF_MEMORY_RESOURCES_LIM}
              nvidia.com/gpu: ${INF_GPU_RESOURCES_LIM}
      volumes:
        - name: cache
          emptyDir: {}
        - name: io-transfer-volume
          persistentVolumeClaim:
            claimName: disagg-data-pvc
            readOnly: false
        - name: datasets
          persistentVolumeClaim:
            claimName: datasets