kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: ${EPP_NAME}
rules:
- apiGroups:
  - ""
  resources:
  - "pods"
  verbs:
  - "get"
  - "list"
  - "watch"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${EPP_NAME}-binding
subjects:
- kind: ServiceAccount
  name: ${EPP_NAME}
  namespace: ${NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${EPP_NAME}
