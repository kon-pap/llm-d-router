# ------------------------------------------------------------------------------
# VLLM Postprocessing Multi-Pool Component
#
# Shared postprocessing deployment used by all inference pools. Pod template
# carries a SHARED_APP_NAME app label so each pool's EPP can select it via the
# endpoint selector. Uses SHARED_SERVED_MODEL_NAME as the served model name to
# successfully serve all model variants (e.g. "terratorch", "terratorch-flood").
# ------------------------------------------------------------------------------
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- deployment.yaml
