apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- disagg-data-pvc.yaml
- ../../../components/vllm-preprocess-multi-pool/
- ../../../components/vllm-postprocess-multi-pool/

patches:
  - target:
      kind: Deployment
      name: ${POST_DEPLOYMENT_NAME}
    patch: |
      - op: add
        path: /spec/template/spec/initContainers/0/args/-
        value: "--io-connector=${IO_CONNECTOR_TYPE}"

components:
- ../../../components/overlays/real-vllm/
