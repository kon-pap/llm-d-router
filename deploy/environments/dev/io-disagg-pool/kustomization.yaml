apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../../components/vllm-inference-pool/
- ../../../components/inference-gateway-pool/

patches:
  - target:
      kind: Deployment
      name: ${INF_DEPLOYMENT_NAME}
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --io-transfer-config=${INF_IO_TRANSFER_CONFIG}
