apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- extra-code-cm.yaml
- ../../../components/vllm-preprocess/
- ../../../components/vllm-inference/
- ../../../components/vllm-postprocess/

patches:
  - target:
      kind: Deployment
      name: ${POST_DEPLOYMENT_NAME}
    patch: |
      - op: add
        path: /spec/template/spec/initContainers/0/args/-
        value: "--io-connector=${IO_CONNECTOR_TYPE}"

components:
- ../../../components/overlays/real-vllm/